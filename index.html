<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1021">
  <meta name="description" content="מרכז המשחקים: חמישה משחקי דפדפן במקום אחד. פולשים מהחלל, פונג, איקס עיגול, סיימון אומר ונינג'ת הפירות.">
  <title>מרכז המשחקים</title>
  <link rel="icon" href="assets/icons/logo-icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/icons/logo-icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/logo-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="application-name" content="מרכז המשחקים">
  <meta name="apple-mobile-web-app-title" content="משחקים">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Link previews need absolute addresses. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">
  <meta property="og:site_name" content="מרכז המשחקים">
  <meta property="og:title" content="מרכז המשחקים">
  <meta property="og:description" content="חמישה משחקים במקום אחד, בלי הרשמה ובלי הורדות.">
  <meta property="og:url" content="https://yanai-lez.github.io/gaming-hub/">
  <meta property="og:image" content="https://yanai-lez.github.io/gaming-hub/assets/icons/share-2.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://yanai-lez.github.io/gaming-hub/assets/icons/share-2.jpg">
  <link rel="stylesheet" href="css/main.css?v=5">
  <link rel="stylesheet" href="css/home.css?v=5">
  <link rel="stylesheet" href="css/games.css?v=5">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-home" type="button" aria-label="חזרה לדף הבית" title="דף הבית" hidden></button>
    <a class="brand" href="#/">
      <img src="assets/icons/logo-icon-64.png" alt="" width="38" height="38">
      <span id="brand-text">מרכז המשחקים</span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-pause" type="button" aria-label="השהיה" title="השהיה (P)" hidden></button>
      <button class="icon-btn" id="btn-mute" type="button" aria-label="השתקה" title="השתקה (M)"></button>
      <button class="icon-btn" id="btn-fullscreen" type="button" aria-label="מסך מלא" title="מסך מלא (F)"></button>
      <button class="icon-btn" id="btn-settings" type="button" aria-label="הגדרות" title="הגדרות"></button>
    </div>
  </header>

  <main id="home" class="home">
    <section class="hero">
      <h1>חמישה משחקים.<br><span>ארקייד אחד.</span></h1>
      <p>בלי הרשמה ובלי הורדות. השיאים שלכם נשמרים במכשיר הזה.</p>
      <div class="hero-actions">
        <button class="btn btn-accent" id="btn-install" type="button" hidden>⬇ התקנת האפליקציה</button>
        <a class="btn btn-ghost" id="continue-link" href="#/" hidden></a>
      </div>
    </section>
    <section class="cards" id="cards" aria-label="משחקים"></section>
  </main>

  <main id="game" class="game" hidden>
    <div class="hud" id="hud" aria-live="off"></div>
    <div class="play-area">
      <div class="stage-wrap">
        <div class="stage" id="stage" tabindex="-1"></div>
        <div class="overlay" id="overlay" hidden></div>
      </div>
      <aside class="side" id="side"></aside>
    </div>
  </main>

  <dialog id="settings" class="dialog" aria-labelledby="settings-title">
    <h2 id="settings-title">הגדרות</h2>
    <label class="row"><span>השתקת הכול</span><input type="checkbox" data-setting="muted"></label>
    <label class="row"><span>אפקטים קוליים</span><input type="checkbox" data-setting="sfx"></label>
    <label class="row"><span>עוצמת האפקטים</span><input type="range" min="0" max="1" step="0.05" data-setting="sfxVolume"></label>
    <label class="row"><span>מוזיקת רקע</span><input type="checkbox" data-setting="music"></label>
    <label class="row"><span>עוצמת המוזיקה</span><input type="range" min="0" max="1" step="0.05" data-setting="musicVolume"></label>
    <label class="row"><span>רטט (בטלפונים תומכים)</span><input type="checkbox" data-setting="vibration"></label>
    <label class="row"><span>רעידות מסך וחלקיקים</span><input type="checkbox" data-setting="effects"></label>
    <div class="dialog-actions">
      <button class="btn btn-danger" id="btn-reset" type="button">מחיקת הנתונים</button>
      <button class="btn" id="btn-close-settings" type="button">סיום</button>
    </div>
  </dialog>

  <dialog id="install-help" class="dialog" aria-labelledby="install-title">
    <h2 id="install-title">התקנת האפליקציה</h2>
    <ol id="install-steps" class="steps"></ol>
    <div class="dialog-actions"><button class="btn btn-accent" id="btn-close-install" type="button">הבנתי</button></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">האתר דורש JavaScript.</p></noscript>

  <script src="js/storage.js?v=5"></script>
  <script src="js/audio.js?v=5"></script>
  <script src="js/engine.js?v=5"></script>
  <script src="js/games/space-invaders.js?v=5"></script>
  <script src="js/games/pong.js?v=5"></script>
  <script src="js/games/tic-tac-toe.js?v=5"></script>
  <script src="js/games/simon-says.js?v=5"></script>
  <script src="js/games/fruit-ninja.js?v=5"></script>
  <script src="js/navigation.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
  <script src="js/install.js?v=5"></script>
</body>
</html>
